# Demo clinic — FICTIONAL. Names, address and numbers are made up for development.
# Phone numbers use the 555-01xx range, which is reserved for fiction in North America.
# This file is the only thing that differs between clinic deployments.

clinic_id: demo_clinic
name: Maplegate Family Clinic
timezone: America/Edmonton          # Calgary is in Mountain Time
main_phone: "+14035550142"
website: "https://maplegate-clinic.example.com"

address:
  street: "Suite 210, 4500 Maplegate Drive SW"
  city: Calgary
  province: AB
  postal_code: "T3E 0A1"
  directions: >-
    We're on the second floor of the Maplegate Professional Centre, above the pharmacy.
    The elevator is to the left of the main entrance.

# 24-hour times, clinic local time. A day that is missing or empty is closed.
hours:
  monday:    [{open: "08:00", close: "17:00"}]
  tuesday:   [{open: "08:00", close: "17:00"}]
  wednesday: [{open: "08:00", close: "19:00"}]
  thursday:  [{open: "08:00", close: "17:00"}]
  friday:    [{open: "08:00", close: "16:00"}]
  saturday:  [{open: "09:00", close: "13:00"}]
  sunday:    []
hours_notes: >-
  Closed on Alberta statutory holidays. The clinic closes from 12:00 to 12:30
  for lunch on weekdays, but phones are still answered.

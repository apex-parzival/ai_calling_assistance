# Optional override: run Kokoro TTS on the NVIDIA GPU instead of the CPU.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.kokoro-gpu.yml --profile agent up -d --build kokoro
# Needs Docker Desktop with GPU support (WSL 2 + NVIDIA driver). Built from Dockerfile.kokoro-gpu,
# which swaps in a CUDA 12.8 PyTorch so RTX 50xx (Blackwell) GPUs work. On an 8 GB laptop GPU it
# shares VRAM with the local Qwen model (~6.2 GB); see docs/phase1-testing.md for what was measured.
services:
  kokoro:
    image: clinic-receptionist-kokoro-gpu
    build:
      context: .
      dockerfile: Dockerfile.kokoro-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

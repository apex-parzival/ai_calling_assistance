# Local stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up --build                    # postgres + backend + dashboard
#   docker compose -f deploy/docker-compose.yml --profile agent up --build    # + voice agent + local Kokoro TTS
# Pick a clinic with CLINIC=<folder under clinics/> (default: demo_clinic).

name: clinic-receptionist

x-clinic: &clinic
  env_file:
    - path: ../clinics/${CLINIC:-demo_clinic}/.env
      required: true
  volumes:
    - ../clinics/${CLINIC:-demo_clinic}/clinic.yaml:/app/clinics/${CLINIC:-demo_clinic}/clinic.yaml:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local development only. Production uses RDS with credentials from Secrets Manager.
      POSTGRES_USER: receptionist
      POSTGRES_PASSWORD: receptionist
      POSTGRES_DB: receptionist
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receptionist -d receptionist"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *clinic
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      CLINIC: ${CLINIC:-demo_clinic}
      # Overrides the localhost URL in the clinic .env so the container reaches the postgres service.
      DATABASE_URL: postgresql+asyncpg://receptionist:receptionist@postgres:5432/receptionist
    command: ["sh", "-c", "alembic upgrade head && uvicorn backend.main:create_app --factory --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  # Self-hosted TTS for clinics with voice.tts_provider: kokoro (local development and testing;
  # production uses Cartesia). OpenAI-compatible: POST /v1/audio/speech, model "kokoro".
  # Started with the agent profile so a plain `docker compose up` doesn't pull it.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: ["agent"]
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped
  # GPU variant: for the production server. The dev laptop has 8 GB of VRAM and the local
  # Qwen model already uses ~5.7-6.2 GB of it, so Kokoro runs on the CPU locally by default.
  # (It does fit on the laptop GPU, ~760 MB, via docker-compose.kokoro-gpu.yml, which also fixes
  # RTX 50xx support; the LLM then gets slower because the two share the GPU.)
  # kokoro:
  #   image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
  #   profiles: ["agent"]
  #   ports:
  #     - "127.0.0.1:8880:8880"
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  agent:
    <<: *clinic
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    environment:
      CLINIC: ${CLINIC:-demo_clinic}
      BACKEND_URL: http://backend:8000
      # LLM_BASE_URL=http://localhost:11434/v1 (Ollama on this machine) -> reach the host, not the container
      LLM_LOCALHOST_ALIAS: host.docker.internal
      # Kokoro TTS (voice.tts_provider: kokoro) is the compose service, not localhost
      KOKORO_BASE_URL: http://kokoro:8880/v1
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      backend:
        condition: service_healthy
      kokoro:
        condition: service_started
        required: false

  # Voice test caller: joins a LiveKit room and talks to the agent (tests/scenarios/voice_call.py).
  # Runs in Linux because Windows Smart App Control can block LiveKit's native library.
  #   docker compose -f deploy/docker-compose.yml --profile agent --profile test run --rm voicetest [scenarios] --write
  voicetest:
    <<: *clinic
    profiles: ["test"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
      args:
        EXTRAS: agent,backend
    environment:
      CLINIC: ${CLINIC:-demo_clinic}
      DATABASE_URL: postgresql+asyncpg://receptionist:receptionist@postgres:5432/receptionist
      BACKEND_URL: http://backend:8000
      LLM_LOCALHOST_ALIAS: host.docker.internal
      KOKORO_BASE_URL: http://kokoro:8880/v1
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ../clinics/${CLINIC:-demo_clinic}/clinic.yaml:/app/clinics/${CLINIC:-demo_clinic}/clinic.yaml:ro
      - ../tests:/app/tests:ro
      - ../docs/scenario-runs:/app/docs/scenario-runs
    entrypoint: ["python", "-m", "tests.scenarios.voice_call"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
